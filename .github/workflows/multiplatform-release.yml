name: Solar Time-Distance Explorer multi-platform release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: Windows x64
            artifact_name: stde-windows-x64
          - runner: ubuntu-24.04
            target: Linux x64
            artifact_name: stde-linux-x64
          - runner: macos-15
            target: macOS Apple Silicon
            artifact_name: stde-macos-arm64
          - runner: macos-15-intel
            target: macOS Intel
            artifact_name: stde-macos-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies and run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          QT_QPA_PLATFORM=offscreen python -m pytest

      - name: Build Windows onedir package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -SkipTests

      - name: Build Linux/macOS native package
        if: runner.os != 'Windows'
        shell: bash
        env:
          SKIP_TESTS: "1"
          PYTHON_COMMAND: python
        run: bash build_unix.sh

      - name: Upload native package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish native release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Solar Time-Distance Explorer $GITHUB_REF_NAME"
